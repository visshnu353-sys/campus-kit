<section class="tool"><input id="a" type=number placeholder="Marks obtained"><input id="b" type=number placeholder="Total marks"><button onclick="go()">Calculate Percentage</button><div id="o" class="result"></div></section>

<script>function go(){let a=+document.getElementById("a").value,b=+document.getElementById("b").value;document.getElementById("o").textContent=b>0?((a/b)*100).toFixed(2)+"%":"Enter valid marks"}</script>
